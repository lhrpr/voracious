name: voracious_app
description: >-
  Voracious desktop. The UI layer only: it renders what voracious_core
  decides and forwards intents back to it, with playback provided by a
  libmpv through media_kit.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.0.3
  path: ^1.9.0
  path_provider: ^2.1.5
  voracious_core:
    path: ../../packages/voracious_core
  media_kit: ^1.2.0
  media_kit_video: ^1.3.0
  # Bundles a stock (GPL) libmpv for each platform. Fine for a personal,
  # open-source build; see the root README.
  media_kit_libs_video: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Only for integration_test/, which needs a real macOS embedder to reach the
  # video output plugin at all. See that directory's test for why.
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

name: voracious_video
description: >-
  Video output for Voracious. Attaches an mpv render context to a running
  libmpv and draws its frames into a texture Flutter composites. macOS only so
  far; the Dart side is written so that adding a platform is adding a renderer,
  not changing this API.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.6.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: VoraciousVideoPlugin
